name: Deploy BCSentinel

on:
  push:
    branches:
      - dev-acceptance
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      release_ref:
        description: Git ref/SHA to deploy. PROD requires an immutable reviewed ref.
        required: true
        type: string
      confirm_prod:
        description: Type PROMOTE_TO_PROD for a PROD deployment
        required: false
        type: string

concurrency:
  group: bcsentinel-deploy-${{ github.event_name == 'push' && 'dev' || inputs.target }}
  cancel-in-progress: false

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Resolve deployment intent
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=dev" >> "$GITHUB_OUTPUT"
            echo "release_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "release_ref=${{ inputs.release_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce PROD promotion acknowledgement
        if: steps.resolve.outputs.target == 'prod'
        shell: bash
        run: |
          test "${{ github.event_name }}" = "workflow_dispatch"
          test "${{ inputs.confirm_prod }}" = "PROMOTE_TO_PROD"
          test -n "${{ inputs.release_ref }}"
          echo "Manual PROD promotion intent accepted."

  regression-gate:
    needs: deployment-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deployment-contract.outputs.release_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release and deployment contracts
        run: |
          python scripts/validate_release_demo_policy.py
          python scripts/validate_e2_automated_regression.py
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Backend regression
        working-directory: backend
        run: |
          alembic heads
          pytest -q
      - name: Dashboard production build
        working-directory: dashboard
        run: |
          npm install
          npm run check
          npm run build

  deploy-dev:
    if: needs.deployment-contract.outputs.target == 'dev'
    needs: [deployment-contract, regression-gate]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deployment-contract.outputs.release_ref }}
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy immutable ref to DEV
        env:
          RELEASE_REF: ${{ needs.deployment-contract.outputs.release_ref }}
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "RELEASE_REF='$RELEASE_REF' bash -s" << 'EOF'
            set -euo pipefail
            cd /home/daniel/data-health-management-dev
            git fetch --all --tags --prune
            git checkout --detach "$RELEASE_REF"
            git clean -fd
            ln -sfn landingpage landingpage_neu

            COMPOSE="docker compose -f docker-compose.dev.yml --env-file .env.dev"

            # Database must be available before migrations run.
            $COMPOSE up -d postgres

            # Build the release images first. Migration commands must never run
            # from a stale backend image that predates the checked-out ref.
            $COMPOSE build

            # Run migrations with the freshly built backend image.
            $COMPOSE run --rm backend alembic upgrade head

            # Recreate running services so the checked-out release is actually
            # what serves traffic, even when an older container is still healthy.
            $COMPOSE up -d --force-recreate

            echo "=== Deployed backend container ==="
            $COMPOSE ps backend
          EOF
      - name: DEV route diagnostics
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s << 'EOF'
            set +e
            cd /home/daniel/data-health-management-dev
            echo "=== DEV compose services ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev ps
            echo "=== Local listeners ==="
            ss -ltn
            echo "=== Local backend HTTP ==="
            curl -sS -o /dev/null -w 'backend_root=%{http_code}\n' http://127.0.0.1:8001/
            curl -sS -o /dev/null -w 'backend_ready=%{http_code}\n' http://127.0.0.1:8001/health/ready
            echo "=== Landing files ==="
            test -f landingpage/index.html && echo 'landing_index=present' || echo 'landing_index=missing'
            test -f landingpage/pilot.html && echo 'landing_pilot=present' || echo 'landing_pilot=missing'
            test -L landingpage_neu && echo "landing_compat=$(readlink landingpage_neu)" || echo 'landing_compat=missing'
            echo "=== Web server status ==="
            systemctl is-active nginx 2>/dev/null || true
            systemctl is-active caddy 2>/dev/null || true
            echo "=== Readable nginx routing evidence ==="
            for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
              if [ -r "$f" ] && [ -f "$f" ]; then
                echo "--- $f"
                grep -E 'server_name|listen|proxy_pass|root|alias' "$f" || true
              fi
            done
          EOF
      - name: DEV acceptance smoke
        run: |
          for i in {1..30}; do
            if curl -4 -fsS https://dev-api.bcsentinel.com/health/ready >/dev/null; then break; fi
            sleep 5
          done

          curl -4 -fsS https://dev-api.bcsentinel.com/health/ready
          curl -4 -fsS https://dev.bcsentinel.com/ >/dev/null
          curl -4 -fsS https://dev.bcsentinel.com/pilot.html >/dev/null

          # Exercise the real waitlist route without persistence or email.
          # The non-empty honeypot field intentionally returns 202 immediately.
          WAITLIST_SMOKE_RESPONSE="$(curl -4 -fsS -X POST \
            https://dev-api.bcsentinel.com/public/pilot-interest \
            -H 'Origin: https://dev.bcsentinel.com' \
            -H 'Content-Type: application/json' \
            --data '{"contact_name":"Deploy Smoke","contact_email":"smoke@example.invalid","privacy_consent":true,"preferred_language":"en","source_page":"deploy-smoke","website":"route-smoke"}')"
          echo "$WAITLIST_SMOKE_RESPONSE" | grep -q '"status":"accepted"'

          echo "DEV acceptance endpoints and waitlist route reachable."

  deploy-prod:
    if: needs.deployment-contract.outputs.target == 'prod'
    needs: [deployment-contract, regression-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deployment-contract.outputs.release_ref }}
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Capture current PROD ref and deploy approved ref
        env:
          RELEASE_REF: ${{ needs.deployment-contract.outputs.release_ref }}
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "RELEASE_REF='$RELEASE_REF' bash -s" << 'EOF'
            set -euo pipefail
            cd /home/daniel/data-health-management
            git rev-parse HEAD > .previous-release-ref
            git fetch --all --tags --prune
            git checkout --detach "$RELEASE_REF"
            git clean -fd -e .previous-release-ref

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            $COMPOSE up -d postgres
            $COMPOSE build
            $COMPOSE run --rm backend alembic upgrade head
            $COMPOSE up -d --force-recreate
          EOF
      - name: PROD smoke
        run: |
          for i in {1..30}; do
            if curl -4 -fsS https://api.bcsentinel.com/health/ready >/dev/null; then break; fi
            sleep 5
          done
          curl -4 -fsS https://api.bcsentinel.com/health/ready
          curl -4 -fsS https://www.bcsentinel.com/ >/dev/null
          echo "PROD smoke passed for approved release ref."
