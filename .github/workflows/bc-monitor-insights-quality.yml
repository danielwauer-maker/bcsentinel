name: BCSentinel Monitor Insights Contract

on:
  push:
    paths:
      - 'backend/app/services/monitor_insights_service.py'
      - 'backend/app/routers/report_access.py'
      - 'backend/tests/test_monitor_insights_v1.py'
      - '.github/workflows/bc-monitor-insights-quality.yml'
  pull_request:
    paths:
      - 'backend/app/services/monitor_insights_service.py'
      - 'backend/app/routers/report_access.py'
      - 'backend/tests/test_monitor_insights_v1.py'
      - '.github/workflows/bc-monitor-insights-quality.yml'
  workflow_dispatch:

jobs:
  report-scoped-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall app/services/monitor_insights_service.py app/routers/report_access.py tests/test_monitor_insights_v1.py
      - name: Test report-specific disclosure and tenant boundaries
        working-directory: backend
        run: python -m pytest tests/test_monitor_insights_v1.py -q
