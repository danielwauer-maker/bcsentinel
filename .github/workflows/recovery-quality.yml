name: E5 Recovery Automation Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  recovery-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      SECRET_KEY: recovery_ci_secret_not_for_prod
      ADMIN_USERNAME: recovery-ci
      ADMIN_PASSWORD: recovery-ci-password
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Validate recovery contract
        run: python scripts/validate_e5_recovery.py
      - name: Create source database
        run: createdb bcsentinel_recovery_src
      - name: Migrate source database to Alembic head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bcsentinel_recovery_src
        run: alembic upgrade head
      - name: Seed recovery probe
        env:
          PGDATABASE: bcsentinel_recovery_src
        run: |
          psql --set=ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE recovery_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO recovery_probe (id, value) VALUES (1, 'bcsentinel-recovery-ok');
          SQL
      - name: Build backup artifact with checksum and manifest
        env:
          PGDATABASE: bcsentinel_recovery_src
        run: bash scripts/backup_postgres.sh artifacts/recovery
      - name: Create isolated restore database
        run: createdb bcsentinel_recovery_dst
      - name: Restore checksum-verified artifact
        env:
          PGDATABASE: bcsentinel_recovery_dst
        run: |
          DUMP_PATH="$(find artifacts/recovery -name '*.dump' -type f | head -n 1)"
          test -n "$DUMP_PATH"
          bash scripts/restore_postgres.sh "$DUMP_PATH"
      - name: Verify restored schema and data probe
        env:
          PGDATABASE: bcsentinel_recovery_dst
        run: |
          TEST_VALUE="$(psql --tuples-only --no-align --command="SELECT value FROM recovery_probe WHERE id = 1;")"
          test "$TEST_VALUE" = "bcsentinel-recovery-ok"
          DB_HEAD="$(psql --tuples-only --no-align --command="SELECT version_num FROM alembic_version LIMIT 1;" | tr -d '[:space:]')"
          CODE_HEAD="$(cd backend && alembic heads | awk '{print $1}' | tr -d '[:space:]')"
          echo "restored_head=$DB_HEAD"
          echo "code_head=$CODE_HEAD"
          test "$DB_HEAD" = "$CODE_HEAD"
      - name: Verify backup manifest and checksum evidence
        run: |
          DUMP_PATH="$(find artifacts/recovery -name '*.dump' -type f | head -n 1)"
          DUMP_DIR="$(dirname "$DUMP_PATH")"
          DUMP_NAME="$(basename "$DUMP_PATH")"
          (cd "$DUMP_DIR" && sha256sum --check "${DUMP_NAME}.sha256")
          python - "${DUMP_PATH}.manifest.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          assert data['format'] == 'postgresql-custom'
          assert data['alembic_version']
          assert len(data['sha256']) == 64
          assert data['size_bytes'] > 0
          print('Recovery manifest evidence: PASS')
          PY
      - name: Upload recovery evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: e5-recovery-evidence-${{ github.run_number }}
          path: artifacts/recovery/
          retention-days: 7
