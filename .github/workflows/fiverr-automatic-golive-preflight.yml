name: Fiverr Automatic Go-Live Preflight

on:
  push:
    paths:
      - 'backend/**'
      - 'bc-extension/**'
      - 'config/bc-compatibility.json'
      - 'docs/FIVERR_*.md'
      - 'release/fiverr-golive-state.json'
      - 'scripts/validate_fiverr_launch_contract.py'
      - 'scripts/validate_controlled_pilot_extension.py'
      - 'scripts/validate_bc_compatibility.py'
      - '.github/workflows/fiverr-automatic-golive-preflight.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'bc-extension/**'
      - 'config/bc-compatibility.json'
      - 'docs/FIVERR_*.md'
      - 'release/fiverr-golive-state.json'
      - 'scripts/validate_fiverr_launch_contract.py'
      - 'scripts/validate_controlled_pilot_extension.py'
      - 'scripts/validate_bc_compatibility.py'
      - '.github/workflows/fiverr-automatic-golive-preflight.yml'
  workflow_dispatch:

jobs:
  contracts-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen Fiverr launch contract
        run: python scripts/validate_fiverr_launch_contract.py
      - name: Validate BC compatibility contract
        run: python scripts/validate_bc_compatibility.py
      - name: Validate controlled-pilot Extension contract
        run: python scripts/validate_controlled_pilot_extension.py

  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install -r requirements.txt
      - name: Run focused controlled-pilot regressions
        run: >-
          pytest -q
          tests/test_f1_initial_free_scan.py
          tests/test_f2_report_family.py
          tests/test_f3_lifecycle_email.py
          tests/test_e1_tenant_security.py
          tests/test_e6_synthetic_pilot_journey.py
          tests/test_lifecycle_admin_templates.py
          tests/test_f8f_quick_lifecycle_email.py
          tests/test_fiverr_next_purchase_email.py
