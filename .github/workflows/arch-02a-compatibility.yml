name: ARCH-02A Compatibility Gate

on:
  pull_request:
    branches:
      - staging
    paths:
      - "backend/app/core/product_model.py"
      - "backend/app/db.py"
      - "backend/app/services/access_control_service.py"
      - "backend/app/services/product_license_service.py"
      - "backend/app/templates/executive_report.html"
      - "backend/app/translations/dashboard/de.json"
      - "backend/app/translations/dashboard/en.json"
      - "backend/tests/test_product_model_contract.py"
      - "backend/tests/test_product_license_contract_alignment.py"
      - "backend/tests/test_access_snapshot_product_model.py"
      - "backend/tests/test_arch_02a_compatibility_regression.py"
      - "backend/tests/test_arch_02a_dashboard_product_copy.py"
      - "bc-extension/app.json"
      - "bc-extension/.vscode/settings.json"
      - "bc-extension/app.ruleset.json"
      - "bc-extension/app/src/**/*.al"
      - "scripts/validate_bc_extension.py"
      - "landingpage_neu/assets/js/i18n.js"
      - "landingpage_neu/lang/product-copy.de.json"
      - "landingpage_neu/lang/product-copy.en.json"
      - "landingpage_neu/index.html"
      - "landingpage_neu/pricing.html"
      - "landingpage_neu/executive-reports.html"
      - "landingpage_neu/why-bcsentinel.html"
      - ".github/workflows/arch-02a-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Product model compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV: test
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-sufficient-length-123
      ADMIN_USERNAME: admin-test
      ADMIN_PASSWORD: admin-password-for-tests-123
      DATABASE_URL: sqlite:////tmp/arch-02a.sqlite3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --quiet -r backend/requirements.txt

      - name: BC extension source and analyzer preflight
        run: python scripts/validate_bc_extension.py

      - name: Product model contract
        working-directory: backend
        run: python -m pytest -q --tb=short --noconftest tests/test_product_model_contract.py

      - name: License and storage compatibility
        working-directory: backend
        run: python -m pytest -q --tb=short --noconftest tests/test_product_license_contract_alignment.py

      - name: Access snapshot product context
        working-directory: backend
        run: python -m pytest -q --tb=short --noconftest tests/test_access_snapshot_product_model.py

      - name: TTL and legacy API regression
        working-directory: backend
        run: python -m pytest -q --tb=short --noconftest tests/test_arch_02a_compatibility_regression.py

      - name: Dashboard, BC, report and landing product copy contract
        working-directory: backend
        run: python -m pytest -q --tb=short --noconftest tests/test_arch_02a_dashboard_product_copy.py

      - name: Full backend regression
        id: full_backend_regression
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: python -m pytest -q --tb=short -x > arch-02a-full-pytest.log 2>&1

      - name: Publish backend regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-02a-backend-regression
          path: backend/arch-02a-full-pytest.log
          if-no-files-found: error
          retention-days: 7

      - name: Report backend regression failure
        if: steps.full_backend_regression.outcome == 'failure'
        working-directory: backend
        shell: bash
        run: |
          echo "Full backend regression failed. Diagnostic artifact: arch-02a-backend-regression"
          tail -n 80 arch-02a-full-pytest.log
          exit 1
