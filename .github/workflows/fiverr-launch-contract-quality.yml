name: Fiverr Launch Contract Quality Gate

on:
  push:
    paths:
      - 'docs/FIVERR_PILOT_RELEASE_CANDIDATE.md'
      - 'docs/FIVERR_GIG_LAUNCH_KIT.md'
      - 'docs/FIVERR_REQUIREMENTS_DELIVERY_FINAL.md'
      - 'docs/FIVERR_GOLIVE_AUTOMATED_READINESS.md'
      - 'scripts/validate_fiverr_launch_contract.py'
      - '.github/workflows/fiverr-launch-contract-quality.yml'
  pull_request:
    paths:
      - 'docs/FIVERR_PILOT_RELEASE_CANDIDATE.md'
      - 'docs/FIVERR_GIG_LAUNCH_KIT.md'
      - 'docs/FIVERR_REQUIREMENTS_DELIVERY_FINAL.md'
      - 'docs/FIVERR_GOLIVE_AUTOMATED_READINESS.md'
      - 'scripts/validate_fiverr_launch_contract.py'
      - '.github/workflows/fiverr-launch-contract-quality.yml'
  workflow_dispatch:

jobs:
  validate-fiverr-launch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen Fiverr launch contract
        run: python scripts/validate_fiverr_launch_contract.py
