name: Manual Acceptance Plan Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate-manual-acceptance-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single-source manual acceptance matrix
        run: python scripts/validate_manual_acceptance_plan.py
