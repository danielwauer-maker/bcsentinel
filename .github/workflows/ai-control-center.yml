name: AI Control Center MVP checks
on:
  pull_request:
    paths:
      - "tools/ai-control-center/**"
      - ".github/workflows/ai-control-center.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/ai-control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Python syntax
        run: python -m compileall -q app.py project_store.py pm_sync.py pm_mapping.py readiness.py progress_history.py acceptance_review.py blocker_plan.py task_coverage.py pm_insights.py ai_pm_brief.py agent_control.py team_roster.py test_app.py test_project_store.py test_pm_sync.py test_pm_mapping.py test_readiness.py test_progress_history.py test_acceptance_review.py test_blocker_plan.py test_task_coverage.py test_pm_insights.py test_ai_pm_brief.py test_agent_control.py test_team_roster.py test_light_theme.py
      - name: Dashboard JavaScript syntax
        run: |
          python -c 'from pathlib import Path; x=Path("index.html").read_text(); Path("/tmp/ai-control-center.js").write_text(x.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/ai-control-center.js
          python -c 'from pathlib import Path; x=Path("team.html").read_text(); Path("/tmp/ai-control-center-team.js").write_text(x.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/ai-control-center-team.js
