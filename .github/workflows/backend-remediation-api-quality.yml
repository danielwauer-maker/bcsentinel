name: Backend Remediation API Quality Gate

on:
  pull_request:
    paths:
      - "backend/app/routers/remediation.py"
      - "backend/app/remediation_models.py"
      - "backend/app/routers/license.py"
      - "backend/alembic/versions/0018_remediation_read_model.py"
      - "scripts/validate_backend_remediation_api.py"
      - ".github/workflows/backend-remediation-api-quality.yml"
  push:
    branches:
      - main
    paths:
      - "backend/app/routers/remediation.py"
      - "backend/app/remediation_models.py"
      - "backend/app/routers/license.py"
      - "backend/alembic/versions/0018_remediation_read_model.py"
      - "scripts/validate_backend_remediation_api.py"
      - ".github/workflows/backend-remediation-api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend-remediation-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate backend remediation API contract
        run: python scripts/validate_backend_remediation_api.py
