name: EXT-50-12C.3 lossless findings backend
on:
  pull_request:
    branches: [staging, sprint/ext-50-12c-runtime-detection-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcsentinel_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: finding_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bcsentinel_test -d finding_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENV: test
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-sufficient-length-123
      ADMIN_USERNAME: admin-test
      ADMIN_PASSWORD: admin-password-for-tests-123
      DATABASE_URL: sqlite:////tmp/finding-test.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Complete backend regression (baseline failures remain visible)
        id: full
        continue-on-error: true
        working-directory: backend
        run: python -m pytest -c pytest.ini -q --junitxml=repair-full.xml > repair-full.log 2>&1
      - name: Real PostgreSQL migration cycle and guarded downgrade
        if: always()
        working-directory: backend
        env:
          BCSENTINEL_FINDING_MIGRATION_TEST_URL: postgresql+psycopg://bcsentinel_test:disposable_ci_only@localhost:5432/finding_test
        run: python -m pytest -c pytest.ini -q tests/test_ext_50_12c_3_migration.py --junitxml=repair-migration.xml
      - name: Real PostgreSQL identity and concurrency regression
        if: always()
        working-directory: backend
        env:
          BCSENTINEL_TEST_DATABASE_URL: postgresql+psycopg://bcsentinel_test:disposable_ci_only@localhost:5432/finding_test
        run: python -m pytest -c pytest.ini -q tests/test_ext_50_12c_3_identity.py tests/test_ext_50_12c_sync_regression.py tests/test_p0e_postgres_concurrency.py --junitxml=repair-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finding-backend-evidence
          path: |
            backend/repair-*.xml
            backend/repair-*.log
      - name: Preserve full regression failure status
        if: always() && steps.full.outcome != 'success'
        run: |
          tail -n 60 backend/repair-full.log
          exit 1
