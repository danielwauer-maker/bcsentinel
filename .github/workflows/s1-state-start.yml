name: S1 Canonical State Starter

on:
  push:
    branches:
      - s1/runtime-acceptance-start

permissions:
  contents: write

jobs:
  update-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: s1/runtime-acceptance-start
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update canonical S1 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('release/current-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))

          runtime = state['extension']['runtime_evidence']
          runtime['VIEWER'] = 'PASS_without_SUPER_real_BC_SaaS_dashboard_history_readable_setup_and_manual_scan_denied_PR_46'
          runtime['SCAN'] = 'PASS_without_SUPER_10_of_10_modules_199_of_199_checks'
          runtime['SETUP'] = 'final_runtime_acceptance_required'
          runtime['SCHEDULER'] = 'final_runtime_acceptance_required'
          runtime['ADMIN'] = 'final_runtime_acceptance_required'

          state['capability_state']['permissions'] = 'architecture_complete_VIEWER_and_SCAN_real_runtime_verified_SETUP_SCHEDULER_ADMIN_pending'
          state['capability_state']['tenant_switching'] = 'implemented_automated_security_matrix_pass_real_two_tenant_negative_acceptance_required'

          state['next_sprint'] = {
              'id': 'S1',
              'name': 'Runtime Acceptance & Real Tenant Isolation',
              'priority': 'P0',
              'status': 'in_progress',
              'tracking_issue': 121,
              'progress': {
                  'viewer_real_runtime': 'complete',
                  'scan_real_runtime': 'complete',
                  'setup_real_runtime': 'open',
                  'scheduler_real_runtime': 'open',
                  'admin_real_runtime': 'open',
                  'real_two_tenant_isolation': 'open'
              },
              'definition_of_done': 'SETUP SCHEDULER ADMIN pass real BC SaaS runtime without SUPER and real two-tenant DEV switching plus negative isolation evidence passes; prior VIEWER and SCAN real evidence remains valid unless the environment changes materially'
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md_path = Path('docs/BCSENTINEL_MASTER_STATE.md')
          text = md_path.read_text(encoding='utf-8')
          text = text.replace(
              '- Remaining runtime acceptance: VIEWER, SETUP, SCHEDULER, ADMIN.\n',
              '- Real runtime evidence: VIEWER PASS without SUPER (dashboard/history readable; setup and manual scan denied, PR #46); SCAN PASS without SUPER on 1.0.2.25 (10/10 modules, 199/199 checks).\n- Remaining runtime acceptance: SETUP, SCHEDULER, ADMIN.\n'
          )
          marker = 'This Definition of Done is satisfied. The next sprint is intentionally not invented in this file; it should be selected from the remaining evidence-backed release gates.\n'
          replacement = '''This Definition of Done is satisfied.\n\n## Current Sprint 1\n\n**Sprint 1 – Runtime Acceptance & Real Tenant Isolation: IN PROGRESS**\n\nTracking: GitHub issue `#121`.\n\nAlready verified with real evidence:\n\n- VIEWER without SUPER: PASS – dashboard/history readable; setup and manual scan denied (PR #46).\n- SCAN without SUPER: PASS on 1.0.2.25 – synchronized, 10/10 modules, 199/199 checks, Executive Report generated (PR #46).\n- Automated tenant-security attack matrix exists and remains supporting evidence only; it does not replace the real two-tenant test.\n\nRemaining S1 gates:\n\n- SETUP real BC SaaS runtime acceptance without SUPER.\n- SCHEDULER real BC SaaS runtime acceptance without SUPER.\n- ADMIN real BC SaaS runtime acceptance without SUPER.\n- Real DEV switch between two tenants with different roles/entitlements plus negative cross-tenant access evidence.\n\nDefinition of Done:\n\n> SETUP, SCHEDULER and ADMIN pass real BC SaaS runtime without SUPER, and the real two-tenant DEV switching/isolation test passes. Existing VIEWER and SCAN evidence is reused unless the environment changes materially.\n'''
          if marker not in text:
              raise SystemExit('Expected S0 closure marker not found')
          text = text.replace(marker, replacement)
          md_path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot helper and commit
        run: |
          rm .github/workflows/s1-state-start.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BCSENTINEL_MASTER_STATE.md release/current-product-state.json .github/workflows/s1-state-start.yml
          git commit -m 'S1: start runtime acceptance and correct VIEWER evidence'
          git push origin HEAD:s1/runtime-acceptance-start
