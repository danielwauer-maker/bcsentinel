name: BC AL Compile and Cop Gate

on:
  pull_request:
    branches:
      - staging
    paths:
      - "bc-extension/**"
      - ".github/workflows/bc-al-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: BC 27 AL compile with CodeCop and PTECop
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap PowerShell package provider
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
          Get-PackageProvider -Name NuGet | Format-List Name,Version

      - name: Install BcContainerHelper
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module BcContainerHelper -Repository PSGallery -Force -AllowClobber -Scope CurrentUser
          Import-Module BcContainerHelper -Force
          Get-BcContainerHelperVersion

      - name: Resolve BC 27 sandbox artifact
        id: artifact
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module BcContainerHelper -Force
          $artifactUrl = Get-BCArtifactUrl -type Sandbox -country w1 -version 27 -select Latest
          if ([string]::IsNullOrWhiteSpace($artifactUrl)) {
            throw "No BC 27 sandbox artifact could be resolved."
          }
          "url=$artifactUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using artifact: $artifactUrl"

      - name: Compile extension with CodeCop and PTECop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module BcContainerHelper -Force

          $securePassword = ConvertTo-SecureString "P@ssword123456789!" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential ("admin", $securePassword)
          $appFolder = Join-Path $env:GITHUB_WORKSPACE "bc-extension"
          $rulesetFile = Join-Path $appFolder "app.ruleset.json"

          Run-AlPipeline `
            -pipelineName "BCSentinel-ARCH-02A" `
            -containerName "bcsentinel-arch02a" `
            -baseFolder $env:GITHUB_WORKSPACE `
            -appFolders @($appFolder) `
            -artifact "${{ steps.artifact.outputs.url }}" `
            -credential $credential `
            -doNotRunTests `
            -enableCodeCop `
            -enablePerTenantExtensionCop `
            -rulesetFile $rulesetFile `
            -failOn error `
            -keepContainer:$false

      - name: Publish AL build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-al-compile-output
          path: |
            .output/**
            bc-extension/**/*.app
          if-no-files-found: warn
          retention-days: 7
