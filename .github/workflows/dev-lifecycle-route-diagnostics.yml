name: DEV Lifecycle Route Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-lifecycle-route-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-dev-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check public route availability without tenant credentials
        shell: bash
        run: |
          set -euo pipefail
          base="https://dev-api.bcsentinel.com"
          echo "=== Health ==="
          curl -fsS --max-time 15 "$base/health/ready"
          echo
          echo "=== Public OpenAPI route registry ==="
          curl -fsS --max-time 20 "$base/openapi.json" -o /tmp/dev-openapi.json
          python3 - <<'PY'
          import json
          with open('/tmp/dev-openapi.json') as f:
              spec = json.load(f)
          path = '/tenant/lifecycle-profile'
          methods = list(spec.get('paths', {}).get(path, {}))
          print(f'Lifecycle route advertised: {path in spec.get("paths", {})}')
          print(f'Lifecycle methods: {methods}')
          print(f'OpenAPI paths count: {len(spec.get("paths", {}))}')
          PY
          echo "=== Unauthenticated PUT should return 401, not 404 ==="
          status=$(curl -sS --max-time 20 -X PUT "$base/tenant/lifecycle-profile" \
            -H 'Content-Type: application/json' \
            --data '{"primary_notification_email":"probe@example.invalid","preferred_language":"de"}' \
            -o /tmp/lifecycle-reply.json -w '%{http_code}')
          echo "Unauthenticated PUT status: $status"
          python3 - <<'PY'
          import json
          try:
              with open('/tmp/lifecycle-reply.json') as f: data = json.load(f)
              print('Response detail:', str(data.get('detail', '<none>'))[:300])
          except Exception:
              print('Response not JSON')
          PY
          if [[ "$status" != "401" ]]; then
            echo "::warning::Expected 401 from mounted endpoint, got $status. Inspecting backend container next."
          fi
      - name: Diagnose running DEV container and reverse proxy
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /home/daniel/data-health-management-dev
            echo "=== Server checkout HEAD ==="
            git rev-parse HEAD
            echo "=== Running container and image ==="
            docker inspect dhm-dev-backend --format 'name={{.Name}} image={{.Image}} started={{.State.StartedAt}}'
            echo "=== Runtime FastAPI route registry (inside running container) ==="
            docker exec dhm-dev-backend python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=10) as response:
              doc = json.load(response)
          path='/tenant/lifecycle-profile'
          print('container_route_present=',path in doc.get('paths',{}))
          print('container_route_methods=',list(doc.get('paths',{}).get(path,{})))
          PY
            echo "=== Host local endpoint route registry ==="
            python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=10) as response:
              doc=json.load(response)
          print('local_route_present=', '/tenant/lifecycle-profile' in doc.get('paths',{}))
          PY
            echo "=== Active Nginx config summary ==="
            nginx -T 2>/dev/null | grep -E 'server_name dev-api.bcsentinel.com|proxy_pass http://127.0.0.1:800[01]' | head -30 || true
          REMOTE

