name: DEV Lifecycle Authentication Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dev-lifecycle-auth-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-dev-lifecycle:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Set up SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Aggregate recent DEV lifecycle 403 causes without exposing IDs, tokens, or emails
        shell: bash
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            docker logs --since 60m dhm-dev-backend 2>&1 | python3 -c '
          import json, sys, collections
          reasons = collections.Counter()
          lifecycle_requests = collections.Counter()
          recognized = ("Invalid tenant credentials.", "Tenant access is not active.", "Missing tenant authentication credentials.", "Invalid tenant authorization header.")
          for line in sys.stdin:
              try:
                  pos = line.find("{")
                  data = json.loads(line[pos:]) if pos >= 0 else {}
              except (ValueError, TypeError):
                  continue
              path = str(data.get("path") or "")
              event = str(data.get("event") or "")
              status = str(data.get("status_code") or "")
              if path != "/tenant/lifecycle-profile":
                  continue
              if event == "request_completed":
                  lifecycle_requests[status] += 1
              if event == "http_exception" and status == "403":
                  detail = str(data.get("detail") or "")
                  reasons[detail if detail in recognized else "Other 403 (redacted)"] += 1
          print("DEV lifecycle HTTP statuses:", dict(lifecycle_requests))
          print("DEV lifecycle 403 categories:", dict(reasons))
          print("No tenant IDs, email addresses, API tokens, or raw log lines are reported.")
          '
          REMOTE
