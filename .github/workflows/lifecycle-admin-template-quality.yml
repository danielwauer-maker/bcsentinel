name: Lifecycle Admin Template Quality Gate

on:
  push:
    paths:
      - 'backend/app/services/email_template_service.py'
      - 'backend/app/services/lifecycle_template_render_service.py'
      - 'backend/app/services/lifecycle_worker_service.py'
      - 'backend/tests/test_lifecycle_admin_templates.py'
      - 'backend/tests/test_x4_email_i18n.py'
      - 'backend/tests/test_f3_lifecycle_email.py'
      - 'backend/tests/test_f8f_quick_lifecycle_email.py'
      - 'backend/tests/test_fiverr_next_purchase_email.py'
      - '.github/workflows/lifecycle-admin-template-quality.yml'
  pull_request:
    paths:
      - 'backend/app/services/email_template_service.py'
      - 'backend/app/services/lifecycle_template_render_service.py'
      - 'backend/app/services/lifecycle_worker_service.py'
      - 'backend/tests/test_lifecycle_admin_templates.py'
      - 'backend/tests/test_x4_email_i18n.py'
      - 'backend/tests/test_f3_lifecycle_email.py'
      - 'backend/tests/test_f8f_quick_lifecycle_email.py'
      - 'backend/tests/test_fiverr_next_purchase_email.py'
      - '.github/workflows/lifecycle-admin-template-quality.yml'
  workflow_dispatch:

jobs:
  lifecycle-admin-templates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: pip install -r requirements.txt
      - name: Run lifecycle template and Fiverr mail regressions
        run: >-
          pytest -q
          tests/test_lifecycle_admin_templates.py
          tests/test_x4_email_i18n.py
          tests/test_f3_lifecycle_email.py
          tests/test_f8f_quick_lifecycle_email.py
          tests/test_fiverr_next_purchase_email.py
