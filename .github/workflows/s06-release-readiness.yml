name: S06 Release Readiness

on:
  pull_request:
    branches: [staging]
    paths:
      - "bc-extension/app.json"
      - "bc-extension/app.cloud.json"
      - "quality/release/s06-release-readiness.json"
      - "backend/tests/test_s06_release_readiness_contract.py"
      - "docs/S06_RELEASE_READINESS.md"
      - ".github/workflows/s06-release-readiness.yml"
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: test
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-sufficient-length-123
      ADMIN_USERNAME: admin-test
      ADMIN_PASSWORD: admin-password-for-tests-123
      DATABASE_URL: sqlite:////tmp/s06-release-readiness.sqlite3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --quiet -r backend/requirements.txt

      - name: Validate S06 release-readiness contract
        working-directory: backend
        run: |
          mkdir -p ../build/s06
          python -m pytest -q --tb=short             --junitxml=../build/s06/s06-release-readiness-junit.xml             tests/test_s06_release_readiness_contract.py             | tee ../build/s06/s06-release-readiness-pytest.log

      - name: Generate dynamic candidate evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          app = json.loads(Path("bc-extension/app.json").read_text(encoding="utf-8"))
          readiness = json.loads(Path("quality/release/s06-release-readiness.json").read_text(encoding="utf-8"))
          critical = [
              Path("bc-extension/app.json"),
              Path("bc-extension/app.cloud.json"),
              Path("quality/release/s06-release-readiness.json"),
          ]
          evidence = {
              "sprint": "S06",
              "head_sha": os.environ.get("GITHUB_SHA"),
              "extension_version": app["version"],
              "readiness_status": readiness["status"],
              "release_candidate_frozen": readiness["release_candidate"]["frozen"],
              "critical_file_sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in critical
              },
              "manual_gates_open": readiness["manual_gates_open"],
          }
          out = Path("build/s06/s06-release-readiness-evidence.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          Path("build/s06/s06-release-readiness-evidence.md").write_text(
              "# S06 Release Readiness\n\n"
              f"- Head SHA: \`{evidence['head_sha']}\`\n"
              f"- Extension version: {evidence['extension_version']}\n"
              f"- Status: {evidence['readiness_status']}\n"
              f"- RC frozen: {evidence['release_candidate_frozen']}\n"
              f"- Manual gates open: {len(evidence['manual_gates_open'])}\n",
              encoding="utf-8",
          )
          PY
          cat build/s06/s06-release-readiness-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload S06 evidence
        uses: actions/upload-artifact@v4
        with:
          name: s06-release-readiness-evidence
          path: build/s06/
          if-no-files-found: error
          retention-days: 30
