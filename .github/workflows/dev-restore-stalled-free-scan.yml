name: DEV Restore Specific Failed Free Entry Scan

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_RUN_20261104_000001 to authorize this one exact DEV repair"
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore-one-dev-run:
    if: inputs.confirmation == 'RESTORE_RUN_20261104_000001'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Set up SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Perform guarded single-run recovery atomically
        shell: bash
        run: |
          ssh -T "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            docker exec -i dhm-dev-backend python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import select, func
          from app.db import SessionLocal
          from app.models import Scan, ScanRunStatus, TenantScanCredit, ScanIssueRecord
          from app.services.scan_status_service import update_scan_progress

          rid = 'RUN_20261104_000001'
          with SessionLocal() as db:
              with db.begin():
                  run = db.scalar(select(ScanRunStatus).where(ScanRunStatus.run_id == rid).with_for_update())
                  scan = db.scalar(select(Scan).where(Scan.scan_id == rid).with_for_update())
                  assert run is not None and scan is not None, 'Run or scan does not exist'
                  assert run.tenant_id == scan.tenant_id, 'Cross-tenant mismatch'
                  assert run.status in ('running', 'finalizing', 'stalled'), f'Unexpected status: {run.status}'
                  assert run.completed_at_utc is None, 'Scan has already completed'
                  assert scan.checks_count == 0 and scan.issues_count == 0 and scan.data_score == 0, 'Scan data is not empty'
                  assert db.scalar(select(func.count()).select_from(ScanIssueRecord).where(ScanIssueRecord.scan_id == rid)) == 0, 'Scan has persisted findings'
                  assert run.heartbeat_at_utc is not None, 'Run heartbeat missing'
                  now = datetime.now(timezone.utc)
                  heartbeat = run.heartbeat_at_utc.replace(tzinfo=timezone.utc) if run.heartbeat_at_utc.tzinfo is None else run.heartbeat_at_utc
                  assert heartbeat < now - timedelta(minutes=10), 'Scan may still be active'

                  credits = db.scalars(
                      select(TenantScanCredit)
                      .where(TenantScanCredit.tenant_id == run.tenant_id,
                             TenantScanCredit.product_code == 'free_entry')
                      .with_for_update()
                  ).all()
                  assert len(credits) == 1, 'Unexpected Free Entry credit count'
                  credit = credits[0]
                  assert credit.status == 'consumed' and credit.consumed_scan_id == rid, 'Credit no longer belongs to this failed run'
                  assert credit.source == 'tenant_registration', 'Not an original registration credit'

                  update_scan_progress(
                      db,
                      run_id=rid,
                      tenant_id=run.tenant_id,
                      status='failed',
                      progress_percent=run.progress_percent,
                      current_module=run.current_module or 'Finalizing',
                      current_step='Technical finalization failure - recovered on DEV',
                      event_message='Historical incomplete scan marked failed after verified technical error',
                      event_level='warning',
                      error_code='dev_technical_finalization_failure',
                      error_message='Scan could not complete after module processing; original Free Entry credit restored.',
                  )
                  db.flush()
                  db.expire_all()
                  repaired_run = db.scalar(select(ScanRunStatus).where(ScanRunStatus.run_id == rid))
                  repaired_credit = db.get(TenantScanCredit, credit.id)
                  assert repaired_run.status == 'failed', 'Failed-state update not persisted'
                  assert repaired_credit.status == 'available' and repaired_credit.consumed_scan_id is None, 'Automatic original credit restoration did not occur'
                  print('Run transitioned to Failed:', repaired_run.status == 'failed')
                  print('Original Free Entry credit restored:', repaired_credit.status == 'available')
                  print('No new credit rows created, no scan or findings deleted.')
              print('DEV single-run repair transaction: COMMITTED')
          PY
          REMOTE
