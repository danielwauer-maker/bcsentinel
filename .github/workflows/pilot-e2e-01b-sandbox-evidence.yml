name: PILOT-E2E-01B BC Sandbox Evidence

on:
  pull_request:
    branches:
      - staging
    paths:
      - "quality/pilot-e2e/sandbox_evidence*.json"
      - "scripts/validate_pilot_sandbox_evidence.py"
      - "backend/tests/test_pilot_e2e_01b_evidence_contract.py"
      - "docs/PILOT_E2E_01B_*.md"
      - ".github/workflows/pilot-e2e-01b-sandbox-evidence.yml"
  workflow_dispatch:
    inputs:
      evidence_path:
        description: Repository-relative path to completed evidence JSON
        required: true
        default: quality/pilot-e2e/sandbox_evidence.json
      require_all_pass:
        description: Require all BC sandbox and UAT gates to be PASS
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Validate sandbox evidence contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run evidence contract tests
        working-directory: backend
        run: python -m pytest -q tests/test_pilot_e2e_01b_evidence_contract.py

      - name: Validate completed sandbox evidence
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          args=("${{ inputs.evidence_path }}" --evidence-root .)
          if [ "${{ inputs.require_all_pass }}" = "true" ]; then
            args+=(--require-all-pass)
          fi
          python scripts/validate_pilot_sandbox_evidence.py "${args[@]}" | tee pilot-e2e-01b-validation.txt

      - name: Publish validation result
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pilot-e2e-01b-sandbox-validation
          path: pilot-e2e-01b-validation.txt
          if-no-files-found: warn
          retention-days: 30