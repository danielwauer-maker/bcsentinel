name: X1 Apply UI Convergence Patch

on:
  push:
    branches:
      - feat/x1-automation-closure

permissions:
  contents: write

jobs:
  apply-x1-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/x1-automation-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic X1 source patch
        run: python scripts/apply_x1_ui_convergence.py
      - name: Commit patch when source changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "X1 source is already converged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landingpage
          git commit -m "Apply X1 landing convergence patch"
          git push origin HEAD:feat/x1-automation-closure
