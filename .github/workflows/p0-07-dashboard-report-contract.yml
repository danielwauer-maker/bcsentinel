name: P0-07 Dashboard Report Contract

on:
  pull_request:
    branches: [staging]
    paths:
      - "backend/app/routers/dashboard.py"
      - "backend/app/routers/reports.py"
      - "backend/app/templates/dashboard_portal.html"
      - "backend/tests/test_p0_07_dashboard_report_contract.py"
      - ".github/workflows/p0-07-dashboard-report-contract.yml"
      - "docs/P0_07_DASHBOARD_REPORT_AUDIT.md"
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENV: test
      APP_ENV: test
      SECRET_KEY: test-secret-key-with-sufficient-length-123
      ADMIN_USERNAME: admin-test
      ADMIN_PASSWORD: admin-password-for-tests-123
      DATABASE_URL: sqlite:////tmp/p0-07-dashboard-report.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --quiet -r backend/requirements.txt
      - name: Run P0-07 dashboard and report contract tests
        working-directory: backend
        run: |
          mkdir -p ../build/p0-07
          python -m pytest -q --tb=short \
            --junitxml=../build/p0-07/p0-07-junit.xml \
            tests/test_p0_07_dashboard_report_contract.py \
            | tee ../build/p0-07/p0-07-pytest.log
      - name: Generate evidence summary
        if: always()
        run: |
          mkdir -p build/p0-07
          {
            echo "# P0-07 Dashboard and Report Contract"
            echo
            echo "- Workflow: P0-07 Dashboard Report Contract"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: ${{ job.status }}"
            echo "- Dashboard: login, logout, invite, tenant switch and analytics token routes checked"
            echo "- Reports: JSON, HTML, PDF and bound share-token routes checked"
            echo "- Security: HttpOnly/Strict cookie, tenant membership scope and report capability binding checked"
          } > build/p0-07/p0-07-evidence.md
          cat build/p0-07/p0-07-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload P0-07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-07-dashboard-report-evidence
          path: build/p0-07/
          if-no-files-found: error
          retention-days: 30
