name: EXT-50-12B Copied Company Recovery

on:
  pull_request:
    branches: [staging]
    paths:
      - 'bc-extension/app/src/codeunits/DHCopiedCompanyRecovery.Codeunit.al'
      - 'bc-extension/app/src/pageextensions/DHSetupCopiedCompanyRecovery.PageExt.al'
      - 'bc-extension/app/src/permissionsets/BCSentinelCopiedCompanyRecovery.PermissionSetExt.al'
      - 'backend/app/services/tenant_registration_service.py'
      - 'tests/test_ext_50_12b_copied_company_recovery.py'
      - 'docs/EXT_50_12B_COPIED_COMPANY_REGISTRATION_RECOVERY.md'
      - 'quality/release/ext-50-12b-copied-company-recovery-evidence.json'
      - '.github/workflows/ext-50-12b-copied-company-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify copied-company recovery safety contract
        run: python -m pytest -q tests/test_ext_50_12b_copied_company_recovery.py
