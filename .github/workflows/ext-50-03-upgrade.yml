name: EXT-50-03 Upgrade Contract

on:
  pull_request:
    branches:
      - staging
    paths:
      - "bc-extension/app.json"
      - "docs/EXT_50_03_UPGRADE_AND_DATA_PRESERVATION.md"
      - "quality/release/ext-50-03-upgrade-evidence.json"
      - "backend/tests/test_ext_50_03_upgrade_contract.py"
      - ".github/workflows/ext-50-03-upgrade.yml"
  push:
    branches:
      - staging
    paths:
      - "bc-extension/app.json"
      - "docs/EXT_50_03_UPGRADE_AND_DATA_PRESERVATION.md"
      - "quality/release/ext-50-03-upgrade-evidence.json"
      - "backend/tests/test_ext_50_03_upgrade_contract.py"
      - ".github/workflows/ext-50-03-upgrade.yml"
  workflow_dispatch:

jobs:
  verify-upgrade-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run EXT-50-03 contract
        run: python -m pytest -q --tb=short backend/tests/test_ext_50_03_upgrade_contract.py
