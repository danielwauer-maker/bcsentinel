<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900"><rect width="100%" height="100%" fill="#061a31"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="35" y="58" fill="#fff" font-size="30" font-weight="700">◈ BCSentinel · Auth-Flows</text><text x="1635" y="58" fill="#55e3a1" font-size="22" font-weight="700">9.8/10</text><g transform="translate(30,100)"><rect width="550" height="760" rx="18" fill="#f7fbff"/><rect width="550" height="58" rx="18" fill="#1e7ae6"/><text x="24" y="38" fill="#fff" font-size="24" font-weight="700">Free</text><text x="28" y="115" fill="#0b1740" font-size="25" font-weight="700">Login &amp; Registrierung</text><rect x="110" y="165" width="330" height="360" rx="18" fill="#fff" stroke="#dbe6f0"/><text x="145" y="220" fill="#0b1740" font-size="24" font-weight="700">Willkommen bei BCSentinel</text><text x="145" y="265" fill="#66778d">E-Mail</text><rect x="145" y="280" width="260" height="42" rx="8" fill="#f4f8fc"/><text x="145" y="350" fill="#66778d">Passwort</text><rect x="145" y="365" width="260" height="42" rx="8" fill="#f4f8fc"/><rect x="145" y="445" width="260" height="44" rx="9" fill="#1570ef"/><text x="275" y="474" text-anchor="middle" fill="#fff" font-weight="700">Anmelden</text></g><g transform="translate(610,100)"><rect width="550" height="760" rx="18" fill="#f7fbff"/><rect width="550" height="58" rx="18" fill="#ff7a1a"/><text x="24" y="38" fill="#fff" font-size="24" font-weight="700">Assessment</text><text x="28" y="115" fill="#0b1740" font-size="25" font-weight="700">Invite → Tenant Binding</text><rect x="70" y="165" width="410" height="390" rx="18" fill="#fff" stroke="#dbe6f0"/><text x="105" y="220" fill="#0b1740" font-size="22" font-weight="700">Einladung annehmen</text><text x="105" y="265" fill="#66778d">1. E-Mail bestätigen</text><text x="105" y="305" fill="#66778d">2. Konto anlegen / Passwort setzen</text><text x="105" y="345" fill="#66778d">3. Tenant &amp; Rolle bestätigen</text><text x="105" y="385" fill="#66778d">4. Welcome State → Assessment Dashboard</text><rect x="105" y="445" width="300" height="44" rx="9" fill="#ff7a1a"/><text x="255" y="474" text-anchor="middle" fill="#fff" font-weight="700">Einladung abschließen</text></g><g transform="translate(1190,100)"><rect width="550" height="760" rx="18" fill="#f7fbff"/><rect width="550" height="58" rx="18" fill="#16a66a"/><text x="24" y="38" fill="#fff" font-size="24" font-weight="700">Monitoring</text><text x="28" y="115" fill="#0b1740" font-size="25" font-weight="700">Secure Session &amp; Re-Auth</text><rect x="70" y="165" width="410" height="390" rx="18" fill="#fff" stroke="#dbe6f0"/><text x="105" y="220" fill="#0b1740" font-size="22" font-weight="700">Session Security</text><text x="105" y="265" fill="#66778d">Tenant: DE-PROD-01 · Rolle: Administrator</text><text x="105" y="305" fill="#16a66a">● Monitoring aktiv</text><text x="105" y="345" fill="#66778d">Re-Auth bei sensiblen Aktionen</text><text x="105" y="385" fill="#66778d">Session Timeout · Logout · sichere Fehlerzustände</text></g></svg>