server {
    listen 443 ssl http2;
    server_name bcsentinel.com www.bcsentinel.com;

    ssl_certificate /etc/letsencrypt/live/bcsentinel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bcsentinel.com/privkey.pem;

    root /var/www/bcsentinel/landingpage;
    index index.html;
    client_max_body_size 10m;

    location = /billing/webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /_bcsentinel_internal/ai-control-center-admin-auth {
        internal;
        proxy_pass http://127.0.0.1:8000/_internal/admin-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location = /admin/ai-control-center {
        auth_request /_bcsentinel_internal/ai-control-center-admin-auth;
        include /etc/nginx/snippets/bcsentinel-ai-control-center-proxy-auth.conf;
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /admin/ai-control-center;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }

    location ^~ /admin/ai-control-center/ {
        auth_request /_bcsentinel_internal/ai-control-center-admin-auth;
        include /etc/nginx/snippets/bcsentinel-ai-control-center-proxy-auth.conf;
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /admin/ai-control-center;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }

    location = /docs {
        root /var/www/bcsentinel/landingpage;
        try_files /docs.html =404;
    }

    location = /docs.html {
        root /var/www/bcsentinel/landingpage;
        try_files /docs.html =404;
    }

    location ~ ^/(pricing|reports|license|scan|scans|analytics|billing|public|tenant|health|openapi\.json|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

