# Standalone, private bind only. Place behind authenticated TLS reverse proxy/VPN.
services:
  ai-control-center:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TRACKER_PATH: /data/master-tracker.xlsx
      PROJECT_DB_PATH: /state/projects.sqlite3
      DEV_HEALTH_URL: https://dev-api.bcsentinel.com/health/ready
    volumes:
      - ./data:/data:ro
      - ./state:/state:rw
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 512m
    cpus: 0.75

  ai-pm-sync:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PROJECT_DB_PATH: /state/projects.sqlite3
    volumes:
      - ./state:/state:rw
    command: ["/bin/sh", "-c", "while true; do python pm_sync.py sync || true; sleep 1800; done"]
    mem_limit: 192m
    cpus: 0.25
